services:
  fastapi-app:
    build:
      context: ./fastapi-app      # Dockerfile이 위치한 디렉토리 경로
      dockerfile: fastapi-app/Dockerfile      # Dockerfile 이름 (생략 가능, 기본값은 'Dockerfile')
    container_name: FastApi-app-sogang016
    ports:
      - "5016:8000" #팀 서버에서 쓰기 위해서 5016으로 설정
    restart: unless-stopped       # 서버 재부팅·오류 시 자동 재시작
    security_opt:
      - no-new-privileges:true    # 컨테이너 안에서 권한 상승 차단
    cap_drop:
      - ALL                       # 불필요한 커널 권한 모두 제거