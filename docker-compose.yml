services:
  config-init:
    image: busybox:1.37
    container_name: config-init
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN:-local-dev-token-change-me}
    volumes:
      - prometheus-config:/cfg/prometheus
      - grafana-provisioning:/cfg/grafana
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /cfg/grafana/datasources /cfg/grafana/dashboards \
                 /cfg/grafana/plugins /cfg/grafana/alerting /cfg/grafana/notifiers
        cat > /cfg/grafana/datasources/influxdb.yml <<EOF
        apiVersion: 1
        datasources:
          - name: InfluxDB-JMeter
            type: influxdb
            access: proxy
            url: http://influxdb:8086
            isDefault: true
            editable: true
            jsonData:
              version: Flux
              organization: my-org
              defaultBucket: my-bucket
              httpMode: POST
              timeout: 30
            secureJsonData:
              token: $${INFLUX_TOKEN}
        EOF
        cat > /cfg/prometheus/prometheus.yml <<'EOF'
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        scrape_configs:
          - job_name: prometheus
            static_configs:
              - targets: ['localhost:9090']

          - job_name: node-exporter
            static_configs:
              - targets: ['node-exporter:9100']

          # FastAPI 앱이 /metrics 를 노출하지 않으면 이 타겟만 DOWN 으로 뜹니다.
          # (prometheus-fastapi-instrumentator 등을 붙이면 동작)
          - job_name: fastapi-app
            metrics_path: /metrics
            static_configs:
              - targets: ['fastapi-app:8000']
        EOF
        echo "config-init: prometheus.yml and grafana datasource written"
    networks:
      - loadtest-net

  fastapi-app:
    build:
      context: ./fastapi-app
      dockerfile: Dockerfile
    container_name: FastApi-app
    ports:
      - "5001:8000"
    networks:
      - loadtest-net

  jmeter:
    image: alpine/jmeter:5.6.3
    container_name: jmeter
    profiles: ["test"]
    volumes:
      - ./fastapi_test_plan.jmx:/jmeter/fastapi_test_plan.jmx:ro
      - ./results:/jmeter/results
    working_dir: /jmeter
    depends_on:
      influxdb:
        condition: service_healthy
      fastapi-app:
        condition: service_started
    command:
      - -n
      - -t
      - /jmeter/fastapi_test_plan.jmx
      - -f
      - -l
      - /jmeter/results/results.jtl
      - -e
      - -o
      - /jmeter/results/report
      - -JTARGET_HOST=fastapi-app
      - -JTARGET_PORT=8000
      - -JINFLUX_URL=http://influxdb:8086/api/v2/write?org=my-org&bucket=my-bucket
      - -JINFLUX_TOKEN=${INFLUX_TOKEN:-local-dev-token-change-me}
      # 부하 조절
      - -JTHREADS=10
      - -JRAMP_UP=10
      - -JDURATION=180
      - -Jjmeter.save.saveservice.output_format=csv
    networks:
      - loadtest-net

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUX_ADMIN_PASSWORD:-local-dev-password-change-me}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN:-local-dev-token-change-me}
      - DOCKER_INFLUXDB_INIT_ORG=my-org
      - DOCKER_INFLUXDB_INIT_BUCKET=my-bucket
      - DOCKER_INFLUXDB_INIT_RETENTION=7d
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - loadtest-net

  grafana:
    image: grafana/grafana:13.3.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-local-dev-password-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - grafana-provisioning:/etc/grafana/provisioning:ro
    depends_on:
      config-init:
        condition: service_completed_successfully
      influxdb:
        condition: service_healthy
    networks:
      - loadtest-net

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: prometheus
    volumes:
      - prometheus-config:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "7070:9090"
    depends_on:
      config-init:
        condition: service_completed_successfully
    networks:
      - loadtest-net

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    ports:
      - "7100:9100"
    networks:
      - loadtest-net

  sonarqube:
    image: sonarqube:26.10.0.133078-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    networks:
      - loadtest-net

networks:
  loadtest-net:
    driver: bridge

volumes:
  prometheus-config:
  prometheus-data:
  grafana-provisioning:
  grafana-data:
  influxdb-data:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
